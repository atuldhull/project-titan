# PROJECT TITAN — local stack (Vol 3 §13.1, TITAN-BCK-026).
# `cp .env.example .env && docker compose up` starts the full core platform.
#
# Profiles (Vol 3 §13.1): the default (no profile) IS the minimal core set —
# web/api/postgres/redis/qdrant; `--profile minimal` starts the same set.
# Heavier stacks are opt-in:
#   --profile local-llm                 adds Ollama (free local models)
#   --profile observability (or obs)    Prometheus/Grafana/Tempo/Loki/promtail/otel-collector
# To export traces, also set TITAN_OTEL_EXPORTER_OTLP_ENDPOINT in .env
# (see .env.example). Worker and Keycloak join the core in later phases.

name: titan

services:
  web:
    build:
      context: ./apps/web
      dockerfile: ../../infra/docker/titan-frontend.Dockerfile
    ports:
      # Spec default 3000 (TITAN-BCK-026); override WEB_PORT in .env if another
      # local process already holds it.
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    read_only: true
    tmpfs:
      - /app/.next/cache
      - /tmp
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  api:
    build:
      context: ./apps/api
      dockerfile: ../../infra/docker/titan-api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      TITAN_ENVIRONMENT: local
      TITAN_LOG_LEVEL: ${TITAN_LOG_LEVEL:-INFO}
      TITAN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-titan}:${POSTGRES_PASSWORD:-titan}@postgres:5432/${POSTGRES_DB:-titan}
      TITAN_REDIS_URL: redis://redis:6379/0
      TITAN_QDRANT_URL: http://qdrant:6333
      TITAN_OTEL_EXPORTER_OTLP_ENDPOINT: ${TITAN_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # LLM gateway (Phase 15): config dir mounted read-only below. The default
      # models.yaml routes to Anthropic (needs ANTHROPIC_API_KEY). For a fully
      # local, zero-key run set TITAN_MODELS_CONFIG_PATH to the local profile and
      # start Ollama:  TITAN_MODELS_CONFIG_PATH=/app/config/models.local.yaml
      #                docker compose --profile local-llm up
      TITAN_MODELS_CONFIG_PATH: ${TITAN_MODELS_CONFIG_PATH:-/app/config/models.yaml}
      TITAN_PRICES_CONFIG_PATH: ${TITAN_PRICES_CONFIG_PATH:-/app/config/prices.yaml}
      TITAN_OLLAMA_BASE_URL: ${TITAN_OLLAMA_BASE_URL:-http://ollama:11434}
      # Per-task workspace jail root (Phase 20). On the writable tmpfs like
      # artifacts; the rootfs stays read-only. Sandbox code-exec containers are
      # created by the Sandbox Controller only where a Docker daemon is reachable.
      TITAN_SANDBOX_WORKSPACE_ROOT: /tmp/titan-workspaces
      # Egress path (Phase 23) — empty by default (deny-all sandbox, web.* off);
      # set these + `--profile egress` to enable. See .env.example.
      TITAN_RESEARCH_GATEWAY_URL: ${TITAN_RESEARCH_GATEWAY_URL:-}
      TITAN_RESEARCH_GATEWAY_TOKEN: ${TITAN_RESEARCH_GATEWAY_TOKEN:-}
      TITAN_EGRESS_PROXY_SECRET: ${TITAN_EGRESS_PROXY_SECRET:-}
      TITAN_SANDBOX_EGRESS_NETWORK: ${TITAN_SANDBOX_EGRESS_NETWORK:-}
      TITAN_SANDBOX_FORWARD_PROXY_URL: ${TITAN_SANDBOX_FORWARD_PROXY_URL:-}
      TITAN_SANDBOX_PIP_INDEX_URL: ${TITAN_SANDBOX_PIP_INDEX_URL:-}
      TITAN_SANDBOX_NPM_REGISTRY_URL: ${TITAN_SANDBOX_NPM_REGISTRY_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./config:/app/config:ro  # models.yaml (hot-reloadable; read-only mount)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      # /readyz (not /healthz): reflects dependency health AND refreshes the
      # titan_readyz_dependency_up gauge every interval, so the Grafana panel
      # never shows a stale probe.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: ./apps/api
      dockerfile: ../../infra/docker/titan-worker.Dockerfile
    # Self-heal on crash (defense in depth beyond the loops' own resilience).
    restart: unless-stopped
    environment:
      TITAN_ENVIRONMENT: local
      TITAN_LOG_LEVEL: ${TITAN_LOG_LEVEL:-INFO}
      TITAN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-titan}:${POSTGRES_PASSWORD:-titan}@postgres:5432/${POSTGRES_DB:-titan}
      TITAN_REDIS_URL: redis://redis:6379/0
      TITAN_QDRANT_URL: http://qdrant:6333
      # Artifacts live on the writable tmpfs at MVP (object storage swaps in
      # behind the Storage protocol later); the rootfs stays read-only.
      TITAN_ARTIFACT_ROOT: /tmp/titan-artifacts
      TITAN_SANDBOX_WORKSPACE_ROOT: /tmp/titan-workspaces
      # Egress path (Phase 23) — empty by default; set + `--profile egress`.
      TITAN_RESEARCH_GATEWAY_URL: ${TITAN_RESEARCH_GATEWAY_URL:-}
      TITAN_RESEARCH_GATEWAY_TOKEN: ${TITAN_RESEARCH_GATEWAY_TOKEN:-}
      TITAN_EGRESS_PROXY_SECRET: ${TITAN_EGRESS_PROXY_SECRET:-}
      TITAN_SANDBOX_EGRESS_NETWORK: ${TITAN_SANDBOX_EGRESS_NETWORK:-}
      TITAN_SANDBOX_FORWARD_PROXY_URL: ${TITAN_SANDBOX_FORWARD_PROXY_URL:-}
      TITAN_SANDBOX_PIP_INDEX_URL: ${TITAN_SANDBOX_PIP_INDEX_URL:-}
      TITAN_SANDBOX_NPM_REGISTRY_URL: ${TITAN_SANDBOX_NPM_REGISTRY_URL:-}
      TITAN_WORKER_CONCURRENCY: ${TITAN_WORKER_CONCURRENCY:-4}
      # LLM gateway config (consumed once the run executor calls it, Phase 17).
      TITAN_MODELS_CONFIG_PATH: ${TITAN_MODELS_CONFIG_PATH:-/app/config/models.yaml}
      TITAN_PRICES_CONFIG_PATH: ${TITAN_PRICES_CONFIG_PATH:-/app/config/prices.yaml}
      TITAN_OLLAMA_BASE_URL: ${TITAN_OLLAMA_BASE_URL:-http://ollama:11434}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    expose:
      - "9100"  # /metrics (scraped by Prometheus under the obs profile)
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./config:/app/config:ro  # models.yaml (hot-reloadable; read-only mount)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      # Spec default 5432; override POSTGRES_PORT in .env on host conflict.
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-titan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-titan}
      POSTGRES_DB: ${POSTGRES_DB:-titan}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-titan} -d ${POSTGRES_DB:-titan}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    # AOF everysec (ADR-BCK-02): bounds the crash-loss window to ≤1s; the
    # transactional outbox re-drain covers even that window.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      # Spec default 6379; override REDIS_PORT in .env on host conflict.
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    # No container healthcheck: the qdrant image ships no shell tooling for one.
    # Readiness is asserted end-to-end by the api /readyz probe (Vol 3 §12).

  ollama:
    image: ollama/ollama
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollamamodels:/root/.ollama

  # ---- Observability (opt-in profile; ADR-011, Vol 9 §6) ------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    profiles: ["observability", "obs"]
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      # Spec default 4317; override OTEL_PORT on host conflict.
      - "${OTEL_PORT:-4317}:4317"
    volumes:
      - ./infra/otel/otel-collector.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["observability", "obs"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability", "obs"]
    ports:
      # Spec default 9090; override PROMETHEUS_PORT on host conflict.
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  loki:
    image: grafana/loki:3.3.1
    profiles: ["observability", "obs"]
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      # Spec default 3100; override LOKI_PORT on host conflict.
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - lokidata:/loki

  promtail:
    image: grafana/promtail:3.3.1
    profiles: ["observability", "obs"]
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability", "obs"]
    ports:
      # Spec default 3001 (Vol 3 §13.1); override GRAFANA_PORT on host conflict.
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-titan-local}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki

  # --- Egress path (Phase 23; Vol 8 §5 SEC-042/043) · opt-in: --profile egress ---
  # searxng: the self-hosted, free default search backend for web.search.
  searxng:
    image: searxng/searxng:2025.1.1-0197be6f0
    profiles: ["egress"]
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      # web.search asks for JSON; enable that format.
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    volumes:
      - ./infra/searxng:/etc/searxng:ro
    restart: unless-stopped

  # The audited egress path is TWO services so the sandbox's ONLY reachable peer
  # is the forward proxy — the caching gateway/mirror is NOT on the sandbox
  # network, so it cannot be hit directly (bypassing the proxy's auth+audit).
  # Both run from the titan image with a role flag.
  #
  # titan-egress-proxy: the forward proxy (:8080) — dual-homed on the default net
  # (to reach the gateway + DB) and the INTERNAL sandbox-egress net (sandbox-facing).
  titan-egress-proxy:
    build:
      context: ./apps/api
      dockerfile: ../../infra/docker/titan-worker.Dockerfile
    command: ["python", "-m", "titan.tools.egress"]
    profiles: ["egress"]
    restart: unless-stopped
    environment:
      TITAN_ENVIRONMENT: local
      TITAN_LOG_LEVEL: ${TITAN_LOG_LEVEL:-INFO}
      TITAN_EGRESS_ROLE: forward
      TITAN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-titan}:${POSTGRES_PASSWORD:-titan}@postgres:5432/${POSTGRES_DB:-titan}
      TITAN_EGRESS_PROXY_SECRET: ${TITAN_EGRESS_PROXY_SECRET:-titan-local-egress-secret}
      # Derives the mirror-host allowlist (the gateway host pip/npm are pointed at).
      TITAN_SANDBOX_PIP_INDEX_URL: ${TITAN_SANDBOX_PIP_INDEX_URL:-http://titan-egress-gateway:8090/pypi/simple/}
      TITAN_SANDBOX_NPM_REGISTRY_URL: ${TITAN_SANDBOX_NPM_REGISTRY_URL:-http://titan-egress-gateway:8090/npm/}
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - default
      - sandbox-egress
    depends_on:
      postgres:
        condition: service_healthy

  # titan-egress-gateway: the caching research gateway + pypi/npm mirror (:8090).
  # ONLY on the default network — reachable by the tool host (web.*) and by the
  # forward proxy (for pip/npm), never directly by the sandbox.
  titan-egress-gateway:
    build:
      context: ./apps/api
      dockerfile: ../../infra/docker/titan-worker.Dockerfile
    command: ["python", "-m", "titan.tools.egress"]
    profiles: ["egress"]
    restart: unless-stopped
    environment:
      TITAN_ENVIRONMENT: local
      TITAN_LOG_LEVEL: ${TITAN_LOG_LEVEL:-INFO}
      TITAN_EGRESS_ROLE: gateway
      TITAN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-titan}:${POSTGRES_PASSWORD:-titan}@postgres:5432/${POSTGRES_DB:-titan}
      TITAN_RESEARCH_GATEWAY_TOKEN: ${TITAN_RESEARCH_GATEWAY_TOKEN:-titan-local-gateway-token}
      TITAN_SEARXNG_URL: http://searxng:8080
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy

networks:
  # The sandbox joins ONLY this internal (no-gateway) network; its sole peer is
  # the forward proxy, so deny-all egress is enforced by topology (SEC-043/045).
  sandbox-egress:
    internal: true

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  ollamamodels:
  tempodata:
  promdata:
  lokidata:
  grafanadata:
