# PROJECT TITAN — CI quality gates (Phase 3; TITAN-FND-062/064, TITAN-BCK-001/002/027).
# Stage order per Vol 9 §3: lint → typecheck → tests (build/scan/publish join in
# Phase 76). Every job calls the same Makefile targets developers run locally.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/schemas/package-lock.json
      - run: cd apps/api && uv sync --frozen
      - run: cd apps/web && npm ci
      - run: make lint-style
      - run: make boundaries
      - run: make route-guards
      - run: make agent-purity

  typecheck:
    # Vol 9 §3.1: stage order is fixed — lint → typecheck → tests.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            packages/schemas/package-lock.json
      - run: cd apps/api && uv sync --frozen
      - run: cd apps/web && npm ci
      - run: cd packages/schemas && npm ci
      - run: make typecheck

  test:
    needs: typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: titan
          POSTGRES_PASSWORD: titan
          POSTGRES_DB: titan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U titan -d titan_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Disposable DB for the schema/cycle suites (pytest -m schema)
      TITAN_TEST_DATABASE_URL: postgresql+asyncpg://titan:titan@localhost:5432/titan_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: cd apps/api && uv sync --frozen
      # pytest carries the coverage gate: --cov-fail-under=80 (TITAN-FND-064)
      - run: make test

  # Phase 57 frontend data layer: vitest over the BFF route handlers, the WS
  # state machine (seq-gap / reconnect / degradation), RBAC gating and the toast
  # policy. jsdom only — no browser, no backend needed.
  test-web:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci
      - run: cd packages/api-client && npm ci
      - run: make test-web

  # Phase 65: TITAN-FRT-041 (375 px on all 13 screens, no horizontal body
  # scroll), -042/-043/-045/-046 (axe clean in BOTH themes, visible focus ring,
  # reduced motion, 200% zoom) and -007/-048 (palette, shortcut engine, the ?
  # overlay), in real Chromium.
  #
  # Blocking, not advisory. Hermetic — every API response comes from a page.route
  # fixture typed against the generated contract — so it needs a browser but no
  # Postgres, Qdrant or Ollama.
  e2e-web:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci
      - run: cd packages/api-client && npm ci
      - run: make e2e-web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/.playwright/results
          retention-days: 7

  # TITAN-FRT-005, both clauses: the /org First Load JS budget (<= 300 kB
  # gzipped, counted in the same SI kB `next build` prints) AND the assertion
  # that no heavy visualization is in ANY route's first load. The second clause
  # is what catches a static import of React Flow or dagre on a route the budget
  # never looks at — which is how dagre sat in /graph and /architecture at
  # 30.8 kB gzipped each until Phase 66.
  web-bundle-budget:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci
      - run: cd packages/api-client && npm ci
      - run: make budget-web

  # TITAN-FRT-002 clause 1: four-state story coverage. A new screen cannot merge
  # without stories for loading, empty, error and populated — deleting any one
  # of the 52 fails this job.
  web-story-coverage:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: cd apps/web && npm ci
      - run: cd packages/api-client && npm ci
      - run: make stories-web

  # TITAN-FRT-002 clause 2: the visual regression suite over all 52 stories.
  #
  # Runs INSIDE the same Playwright image the baselines were recorded in, which
  # is what makes a zero-tolerance pixel comparison possible at all — a
  # host-rendered baseline and a runner-rendered comparison would disagree on
  # font rasterisation and force a tolerance wide enough to hide real changes.
  # `container:` here is the CI half of `make visual-web`; both sides pin the
  # same digest-stable tag.
  web-visual:
    needs: typecheck
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: cd apps/web && npm ci
      - run: cd packages/api-client && npm ci
      - run: cd apps/web && npm run build-storybook
      - run: cd apps/web && npm run visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: apps/web/.playwright/storybook-results
          retention-days: 7

  # TITAN-BRN-011: the retrieval quality gate — seeds the versioned golden
  # dataset, reports recall@10 + nDCG@10 in all three reranker modes, and
  # fails on a >5% regression vs the stored baseline (plus the broken-fusion
  # negative control and the TITAN-BRN-004 rebuild gate). Metrics land in the
  # job log and the GitHub step summary.
  retrieval-eval:
    needs: typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: titan
          POSTGRES_PASSWORD: titan
          POSTGRES_DB: titan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U titan -d titan_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TITAN_TEST_DATABASE_URL: postgresql+asyncpg://titan:titan@localhost:5432/titan_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: cd apps/api && uv sync --frozen
      - run: make eval-retrieval

  types-drift:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/schemas/package-lock.json
      - run: cd apps/api && uv sync --frozen
      - run: cd packages/schemas && npm ci
      # Regenerate OpenAPI + TS types; any uncommitted diff fails (TITAN-BCK-027)
      - run: make check-types-drift
      # §4.1 conventions over the OpenAPI document (TITAN-BCK-006)
      - run: make lint-openapi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # TITAN-FND-062: secret scanning gates every push — the exact command
      # developers run locally (no gitleaks-action: it needs a license for org
      # repos and would break command-set parity).
      - run: make secret-scan

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TITAN-SEC-071: semgrep bans string-built SQL in src + migrations, and the
      # self-test proves the rule bites against the committed vulnerable fixture
      # (the acceptance: the rule fires on a committed string-SQL fixture). Same
      # Docker command developers run locally, for command-set parity.
      - run: make semgrep
      - run: make semgrep-selftest

  # TITAN-SEC-100/110: Python SAST (bandit, high/high), the OWASP compliance-map
  # consistency check (removing a mapped test fails here), and lockfile drift —
  # all fast, no Docker, so they gate every PR.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd apps/api && uv sync --frozen
      - run: make sast-python
      - run: make check-compliance
      - run: make check-exceptions
      - run: make check-redteam-register
      - run: make check-migrations
      - run: make check-deploy-digests
      - run: make check-alert-rules
      - run: make check-runbook-links
      - run: make check-k8s
      - run: make check-autoscaling
      - run: make check-bluegreen
      - run: make test-bluegreen-scripts
      - run: make redteam-run
      # `make security-check` runs against the Compose profile (secure env), not this
      # bare runner whose env overrides (e.g. rate limits off in tests) it would flag.
      - run: make lockfile-drift

  # TITAN-SEC-103/104/105: known-vulnerable dependency scanning across ecosystems
  # (pip-audit from the frozen lockfile, npm audit high+, OSV over both lockfiles).
  # HIGH/CRITICAL findings fail the job; expiring exceptions live in
  # security/scan-exceptions.yaml (SEC-100).
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd apps/web && npm ci
      - run: make audit-python
      - run: make audit-web
      - run: make osv-scan

  # TITAN-SEC-101: a CycloneDX SBOM is generated and retained as a build artifact
  # for every commit (release images are additionally signed + attested via cosign
  # in the publish workflow).
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  # TITAN-OPS-002 (Phase 79): schema-lint the K8s manifests. kustomize renders base +
  # both overlays + the Kyverno policies; kubeconform validates every built-in kind
  # (CNPG/Kyverno CRDs are skipped by design). The security posture (no floating images,
  # datastores edge-unreachable) is enforced separately by `make check-k8s` in supply-chain.
  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize + kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz -C /usr/local/bin kubeconform
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- 5.4.3 /usr/local/bin
      - name: kubeconform base + overlays + policies
        run: |
          for t in base overlays/staging overlays/production; do
            echo "== $t =="; kustomize build "infra/k8s/$t" | kubeconform -strict -ignore-missing-schemas -summary
          done
          echo "== policies =="; kustomize build infra/k8s/policies | kubeconform -ignore-missing-schemas -summary

  # Live-provider conformance (TITAN-INT-060 item 4): a SEPARATE, NON-BLOCKING
  # job so real API divergence is surfaced without failing the main pipeline.
  # Each provider leg self-skips when its secret is absent, so this is a no-op
  # (all skipped) on forks/PRs without the org secrets configured.
  test-llm-live:
    needs: typecheck
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: cd apps/api && uv sync --frozen
      - run: make test-llm-live
