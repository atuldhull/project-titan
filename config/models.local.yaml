# PROJECT TITAN — fully-local LLM profile (Vol 7 §8.2, TITAN-INT-062).
#
# Runs the entire platform with ZERO paid API keys: every route resolves to
# Ollama. Select it with TITAN_MODELS_CONFIG_PATH=config/models.local.yaml.
# This is the profile the "local-only" CI lane and the laptop demo use.

providers:
  ollama:
    base_url: ${TITAN_OLLAMA_BASE_URL}

model_aliases:
  local-default:
    provider: ollama
    # Phase 56 (TITAN-AGT-007): 7b is the largest coder model that fits the 16 GB
    # reference laptop (a 30b OOMs it) and is the model pulled for the acceptance
    # run. This fully-local config is what the offline acceptance CLI selects.
    model: qwen2.5-coder:7b
  embed-default:
    provider: ollama
    model: nomic-embed-text
    dimensions: 768

routing:
  default: local-default
  embeddings_default: embed-default
  by_agent: {}
  fallbacks: {}
