[project]
name = "titan-api"
version = "0.1.0"
description = "TITAN backend — modular monolith: API, orchestrator, agent runtime, LLM gateway (TITAN-BCK-001)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "uuid-utils>=0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "import-linter>=2.0",
]
# Minimal closure for the titan-migrate image (Vol 9 §3.3: "Alembic +
# migration scripts only") — no FastAPI, no uvicorn.
migrate = [
    "alembic>=1.13",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titan"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "titan"

[[tool.importlinter.contracts]]
name = "Domain modules are independent except via public service interfaces (TITAN-BCK-001/004)"
type = "independence"
modules = [
    "titan.identity",
    "titan.projects",
    "titan.orchestrator",
    "titan.agents",
    "titan.runs",
    "titan.messaging",
    "titan.memory",
    "titan.plugins",
    "titan.llm",
]
ignore_imports = ["titan.** -> titan.*.service"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Shared libraries never import domain modules (Vol 3 §3: events/observability are libraries)"
type = "forbidden"
source_modules = ["titan.events", "titan.observability"]
forbidden_modules = [
    "titan.identity",
    "titan.projects",
    "titan.orchestrator",
    "titan.agents",
    "titan.runs",
    "titan.messaging",
    "titan.memory",
    "titan.plugins",
    "titan.llm",
]
