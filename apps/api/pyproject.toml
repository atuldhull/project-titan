[project]
name = "titan-api"
version = "0.1.0"
description = "TITAN backend — modular monolith: API, orchestrator, agent runtime, LLM gateway (TITAN-BCK-001)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "uuid-utils>=0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "alembic>=1.13",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=23.1",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "docker>=7.1",
    "playwright>=1.61",
    "readability-lxml>=0.8.1",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "tree-sitter>=0.24",
    "tree-sitter-language-pack>=1.10",
]

[project.optional-dependencies]
# §6.1 in-process cross-encoder reranker (bge-reranker-v2-m3), ONNX backend.
# The [onnx] extra pulls optimum+onnxruntime, and >=4.0 is required for
# CrossEncoder(backend=...). Heavy (torch); RERANKER=llm|off run without it.
rerank = ["sentence-transformers[onnx]>=4.0"]

[project.scripts]
# The operator CLI (Phase 35: `titan memory rebuild-index`, TITAN-BRN-004).
titan = "titan.cli:main"
# The constitution CI kit installer (Phase 45, Vol 6 §6). The DevOps agent runs
# this through the Phase-21 terminal tool inside its sandbox, where it is on PATH
# via infra/docker/titan-sandbox.Dockerfile — hence a dedicated entry point
# rather than a `titan` subcommand: the sandbox carries titan.ci_kit ALONE, and
# titan.cli would drag the whole API in behind it.
titan-ci-init = "titan.ci_kit.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "import-linter>=2.0",
    "fakeredis>=2.36.2",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
]
# Minimal closure for the titan-migrate image (Vol 9 §3.3: "Alembic +
# migration scripts only") — no FastAPI, no uvicorn.
migrate = [
    "alembic>=1.13",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titan"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# ASYNC = flake8-async blocking-call detection (TITAN-BCK-002 acceptance).
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID", "ASYNC"]

# ADR-007: provider SDKs are banned everywhere except the titan.llm gateway
# (per-file exemption below). Belt-and-braces with the import-linter contract.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"anthropic".msg = "Provider SDKs only inside titan.llm — the LLM gateway (ADR-007)"
"openai".msg = "Provider SDKs only inside titan.llm — the LLM gateway (ADR-007)"
"google.generativeai".msg = "Provider SDKs only inside titan.llm — the LLM gateway (ADR-007)"
"google.genai".msg = "Provider SDKs only inside titan.llm — the LLM gateway (ADR-007)"
"ollama".msg = "Provider SDKs only inside titan.llm — the LLM gateway (ADR-007)"

[tool.ruff.lint.per-file-ignores]
"src/titan/llm/**" = ["TID251"]
# Phase 43 seeds the constitution by embedding Vol 6 §6 VERBATIM, and its sha256
# is the artifact's checksum — rewrapping the prose to 100 cols would change the
# bytes and therefore the checksum. The long lines are the spec's own paragraphs,
# not code. (This was failing `make lint-style` unnoticed since Phase 43.)
"alembic/versions/0021_constitution_and_clarification.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The OTel instrumentation packages ship without type stubs.
module = ["opentelemetry.instrumentation.*"]
ignore_missing_imports = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# docker-py ships no py.typed marker / stubs; the Sandbox Controller wraps it
# behind a typed surface (titan.tools.sandbox.controller).
module = ["docker", "docker.*"]
ignore_missing_imports = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# readability-lxml + markdownify ship no stubs; wrapped by titan.tools.web.extract.
module = ["readability", "readability.*", "markdownify"]
ignore_missing_imports = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# Optional `rerank` extra (§6.1 cross-encoder); imported lazily and absent in
# the default dev environment. numpy rides in with onnxruntime there and is
# only an optional fast path for the benchmark's corpus seeding.
module = ["sentence_transformers", "sentence_transformers.*", "numpy", "numpy.*"]
ignore_missing_imports = true
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# TITAN-FND-064: >=80% coverage on core backend code, enforced locally and in CI.
addopts = "--cov=titan --cov-report=term-missing --cov-fail-under=80"
markers = [
    "schema: needs a live disposable PostgreSQL 16 (set TITAN_TEST_DATABASE_URL)",
    "live_llm: hits a real LLM provider (needs API keys / local Ollama); non-blocking CI job",
    "sandbox: needs a reachable Docker daemon + the sandbox base image; non-blocking CI job",
]

[tool.importlinter]
root_package = "titan"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain modules are independent except via public service interfaces (TITAN-BCK-001/004)"
type = "independence"
modules = [
    "titan.identity",
    "titan.projects",
    "titan.orchestrator",
    "titan.agents",
    "titan.runs",
    "titan.messaging",
    "titan.memory",
    "titan.plugins",
    "titan.llm",
    "titan.tools",
    "titan.realtime",
    "titan.intake",
    "titan.runtime",
    "titan.conflict",
    "titan.handoffs",
    "titan.constitution",
    "titan.clarification",
    "titan.loop",
    "titan.review",
    "titan.docs",
    "titan.deploy",
    "titan.debt",
]
ignore_imports = ["titan.** -> titan.*.service"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Provider SDKs are confined to the LLM gateway module (ADR-007)"
type = "forbidden"
source_modules = [
    "titan.main",
    "titan.worker",
    "titan.settings",
    "titan.clients",
    "titan.gateway",
    "titan.identity",
    "titan.projects",
    "titan.orchestrator",
    "titan.agents",
    "titan.runs",
    "titan.messaging",
    "titan.memory",
    "titan.plugins",
    "titan.tools",
    "titan.realtime",
    "titan.intake",
    "titan.runtime",
    "titan.conflict",
    "titan.handoffs",
    "titan.constitution",
    "titan.clarification",
    "titan.loop",
    "titan.review",
    "titan.docs",
    "titan.deploy",
    "titan.debt",
    "titan.ci_kit",
    "titan.events",
    "titan.observability",
]
forbidden_modules = ["anthropic", "openai", "google", "ollama"]

[[tool.importlinter.contracts]]
# Phase 45. This is not style — it is the kit's shipping constraint. The whole
# titan/ci_kit tree is COPY'd into the Alpine sandbox image and vendored into
# every generated workspace, both of which have a bare python3 and NO package
# index (the sandbox is network-denied). One import of titan.settings would pull
# in FastAPI + SQLAlchemy + Pydantic and break `titan-ci-init` everywhere it
# actually runs. The gates must stay stdlib-only.
name = "The constitution CI kit is self-contained: stdlib only, no titan imports (Phase 45)"
type = "forbidden"
source_modules = ["titan.ci_kit"]
forbidden_modules = [
    "titan.main",
    "titan.worker",
    "titan.cli",
    "titan.settings",
    "titan.clients",
    "titan.db",
    "titan.schema",
    "titan.gateway",
    "titan.identity",
    "titan.projects",
    "titan.orchestrator",
    "titan.agents",
    "titan.runs",
    "titan.messaging",
    "titan.memory",
    "titan.plugins",
    "titan.llm",
    "titan.tools",
    "titan.realtime",
    "titan.intake",
    "titan.runtime",
    "titan.conflict",
    "titan.handoffs",
    "titan.constitution",
    "titan.clarification",
    "titan.loop",
    "titan.events",
    "titan.observability",
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "redis",
    "httpx",
    "structlog",
    "alembic",
]

[[tool.importlinter.contracts]]
name = "Shared libraries never import domain modules (Vol 3 §3: events/observability are libraries)"
type = "forbidden"
source_modules = ["titan.events", "titan.observability"]
forbidden_modules = [
    "titan.identity",
    "titan.projects",
    "titan.orchestrator",
    "titan.agents",
    "titan.runs",
    "titan.messaging",
    "titan.memory",
    "titan.plugins",
    "titan.llm",
    "titan.tools",
    "titan.runtime",
    "titan.conflict",
    "titan.handoffs",
    "titan.constitution",
    "titan.clarification",
    "titan.loop",
]
