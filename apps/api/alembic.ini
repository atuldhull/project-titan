# Alembic configuration for the TITAN backend (Vol 3 §13.2).
# The database URL is supplied by titan.settings (TITAN_DATABASE_URL) in
# alembic/env.py — never hardcoded here. Logging is configured in env.py via
# titan.observability.logging (JSON per TITAN-BCK-024), not via this file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
