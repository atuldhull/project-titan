# Alert rules for local Compose (Vol 3 §12; Vol 5 §5.1).
groups:
  - name: titan-memory-pipeline
    rules:
      # §5.1: a message dead-lettered after MAX_ATTEMPTS deliveries means a
      # memory chunk is NOT searchable and needs an operator (TITAN-BRN-007's
      # lag target is silently broken for it until replayed).
      - alert: MemoryIngestDeadLetters
        expr: titan_stream_dlq_depth{stream="titan:memory:ingest"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Memory ingest DLQ is non-empty"
          description: >-
            {{ $value }} poison message(s) in the titan:memory:ingest dead-letter
            stream — chunks are missing from Qdrant until replayed
            (Vol 5 §5.1; check worker logs for memory.ingest_failed).
      # TITAN-BRN-007: p95 commit→searchable must stay ≤ 5 s.
      - alert: MemoryIngestLagHigh
        expr: >-
          histogram_quantile(0.95,
            sum(rate(titan_memory_ingest_lag_seconds_bucket[5m])) by (le)) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory ingestion lag p95 above 5s"
          description: >-
            p95 Memory-Event-commit → searchable latency exceeded the
            TITAN-BRN-007 budget for 5 minutes.
  - name: titan-backpressure
    rules:
      # §7 / §9 (TITAN-OPS-020): the execution tier is saturated when the oldest
      # unacked task has waited > 300 s. Intake keeps accepting + ledgering
      # (durable), so this is queue WAIT, never loss — but it pages so an operator
      # scales workers (KEDA) or lifts a kill switch.
      - alert: QueueBackpressure
        expr: titan_queue_oldest_pending_seconds > 300
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Task queue backpressure — oldest pending > 300s"
          runbook_url: "https://github.com/titan-platform/titan/blob/main/docs/runbooks/ops.md#queue-backpressure"
          description: >-
            {{ $labels.stream }}/{{ $labels.group }} has an unacked task older
            than 300 s for 10 minutes (TITAN-OPS-020). Accepted work is ledgered
            and safe; scale the worker pool or check for a dispatch stall
            (agents.pause_all?).
  - name: titan-audit
    rules:
      # SEC-091 / §13.1: a broken audit hash chain is a SEV-1 (tamper or
      # corruption of the immutable ledger). The daily verification job sets the
      # gauge to 0 on any break.
      - alert: AuditChainBroken
        expr: titan_audit_chain_intact == 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "Audit hash chain verification FAILED (possible tamper)"
          runbook_url: "https://github.com/titan-platform/titan/blob/main/docs/runbooks/incident.md#audit-chain-broken"
          description: >-
            The daily audit_events chain walk found a broken/altered row
            (TITAN-SEC-091). Treat as SEV-1: freeze deploys, preserve the ledger,
            and investigate per RUNBOOK incident response (Vol 8 §13).
