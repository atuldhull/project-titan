# TITAN operational alerts (Phase 77, Vol 9 §7, TITAN-OPS-017). The §7 alerts that are
# NOT SLO burn-rate (those are titan-slo.yml) and NOT already in alerts.yml
# (QueueBackpressure, AuditChainBroken, memory-ingest live there). Every `page` carries
# a runbook_url. Some exprs read exporter metrics (postgres_exporter / redis_exporter /
# kube-state-metrics / blackbox) present in production; they are inert locally until the
# staging/prod infra phase wires those exporters.
groups:
  - name: titan_ops
    rules:
      - alert: WorkerCrashLoop
        expr: increase(kube_pod_container_status_restarts_total{container="titan-worker"}[15m]) > 3
        for: 0m
        labels: { severity: page }
        annotations:
          summary: "titan-worker restarted >3× in 15m (crash loop)"
          runbook_url: "https://github.com/titan-platform/titan/blob/main/ops/runbooks/incident.md#worker-crashloop"

      - alert: PostgresReplicationLag
        expr: pg_replication_lag_seconds > 30
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Postgres replication lag > 30s for 5m"
          runbook_url: "https://github.com/titan-platform/titan/blob/main/ops/runbooks/incident.md#postgres-lag"

      - alert: RedisQueueMemoryHigh
        expr: redis_memory_used_bytes{db="queue"} / clamp_min(redis_memory_max_bytes{db="queue"}, 1) > 0.8
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "Redis queue DB memory > 80% for 10m (backpressure risk)"
          runbook_url: "https://github.com/titan-platform/titan/blob/main/ops/runbooks/incident.md#redis-memory"

      # Provider error rate > 20% over 10m — auto-fallback handles it, so ticket not page.
      # Denominator is TOTAL attempts (errors + successes): request_duration_count only
      # counts SUCCESSES, so a 100%-failing provider has no success series — including
      # errors in the denominator keeps the ratio at 1.0 instead of dropping it (review #6).
      - alert: LLMProviderDegraded
        expr: |
          sum(rate(titan_llm_errors_total[10m])) by (provider)
          / clamp_min(
              sum(rate(titan_llm_errors_total[10m])) by (provider)
              + sum(rate(titan_llm_request_duration_seconds_count[10m])) by (provider), 1e-9) > 0.2
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "LLM provider {{ $labels.provider }} error rate > 20% over 10m"
          runbook_url: "https://github.com/titan-platform/titan/blob/main/ops/runbooks/incident.md#provider-degraded"

      # Per-project budget within 10% of exhaustion (absolute near-zero; a project
      # budget-total gauge would let this use the spec's remaining/budget < 0.1 ratio).
      - alert: ProjectBudgetNearExhaustion
        expr: titan_project_budget_remaining_usd < 1
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "Project {{ $labels.project }} LLM budget near exhaustion"
          runbook_url: "https://github.com/titan-platform/titan/blob/main/ops/runbooks/incident.md#budget-exhaustion"

      # Hourly spend > 3× the trailing 7-day hourly median, sustained 2h.
      - alert: GlobalSpendAnomaly
        expr: |
          (sum(rate(titan_llm_cost_usd_total[1h])) * 3600)
          > 3 * quantile_over_time(0.5, (sum(rate(titan_llm_cost_usd_total[1h])) * 3600)[7d:1h])
        for: 2h
        labels: { severity: page }
        annotations:
          summary: "Global LLM spend > 3× the 7-day hourly median for 2h"
          runbook_url: "https://github.com/titan-platform/titan/blob/main/ops/runbooks/incident.md#spend-anomaly"

      # Backup job failed or missed its schedule (metric emitted by the Phase-78 backup job).
      - alert: BackupFailed
        expr: time() - titan_backup_last_success_timestamp_seconds > 90000
        for: 0m
        labels: { severity: page }
        annotations:
          summary: "No successful backup in >25h (job failed or missed schedule)"
          runbook_url: "https://github.com/titan-platform/titan/blob/main/ops/runbooks/backup-restore.md#backup-failed"

      - alert: CertExpirySoon
        expr: (probe_ssl_earliest_cert_expiry - time()) < (14 * 86400)
        for: 1h
        labels: { severity: ticket }
        annotations:
          summary: "TLS certificate expires in < 14 days"
          runbook_url: "https://github.com/titan-platform/titan/blob/main/ops/runbooks/incident.md#cert-expiry"

      # Sustained agent-KPI degradation (Vol 10 §3, TITAN-EVO-007): the leader's
      # nightly rollup lights titan_agent_kpi_degraded when an agent/task_class
      # composite is >10% below its trailing-30d mean. The in-process detector also
      # opens an evolution.investigation for the Memory Agent; this alert is the
      # maintainer-visible signal. Ticket, not page — a quality regression, not an outage.
      - alert: AgentKpiDegraded
        expr: titan_agent_kpi_degraded == 1
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "Agent {{ $labels.agent }} KPI degraded on task_class {{ $labels.task_class }}"
          runbook_url: "https://github.com/titan-platform/titan/blob/main/ops/runbooks/incident.md#agent-kpi-degraded"

      # Vol 10 §4/§5 (Phase 85): the whole post-terminal evolution subsystem is
      # fail-safe (a broken prompt/provider degrades to F-UNK / no reflection rather
      # than raising), so a systemic breakage is otherwise an invisible silent no-op —
      # the consumer ACKs and queue depth stays 0. This fires when >50% of evolution
      # ops fail over 30m (clamp_min avoids a div-by-zero when idle). Ticket.
      - alert: EvolutionSubsystemFailing
        expr: |
          sum(rate(titan_evolution_ops_total{outcome="failed"}[30m]))
          / clamp_min(sum(rate(titan_evolution_ops_total[30m])), 1) > 0.5
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "Evolution subsystem failing (>50% of scorecard/reflection/RCR ops erroring)"
          runbook_url: "https://github.com/titan-platform/titan/blob/main/ops/runbooks/incident.md#evolution-subsystem-failing"

      # Vol 10 §2/§6 (Phase 86, EVO-003): the A/B monitor auto-reverted a challenger config
      # to the champion after a KPI-floor breach. Fires immediately (a rollback is a discrete
      # event, not a threshold) so an operator reviews why the challenger degraded. The revert
      # already happened — this is notification, not a call to act on live traffic.
      - alert: EvolutionAutoRollback
        expr: increase(titan_evolution_rollbacks_total[10m]) > 0
        for: 0m
        labels: { severity: ticket }
        annotations:
          summary: "Evolution challenger auto-rolled-back to champion (agent {{ $labels.agent }})"
          runbook_url: "https://github.com/titan-platform/titan/blob/main/ops/runbooks/incident.md#evolution-auto-rollback"
