# Prometheus scrape config for local Compose (Vol 3 §12, Vol 9 §6.1).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/rules/*.yml # Phase 77: SLO recording + burn-rate + ops alerts

# Phase 77 (OPS-017): route firing alerts to Alertmanager (page→ntfy/PagerDuty,
# ticket→GitHub issue) — the alertmanager service runs under the `obs` profile.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: titan-api
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: titan-worker
    static_configs:
      - targets: ["worker:9100"]
        labels:
          service: worker
