# Production overlay (Vol 9 §2.4): namespace titan-prod + a ResourceQuota and LimitRange.
# Replica counts come from the base (the §4.3 minimums: api 3, frontend/orchestrator/
# worker/llm-gateway 2), which HPA/KEDA scale up in Phase 80.
#
# DIGEST PINNING (OPS-005): images are version-tagged here; the release pipeline pins them
# to immutable digests at deploy — release.yml runs, from this directory, e.g.
#   kustomize edit set image ghcr.io/titan-platform/titan-api=ghcr.io/titan-platform/titan-api@sha256:<digest-from-cosign-signed-push>
# for each image, using the digests main.yml recorded when it pushed + cosign-signed them.
# Digests are NOT committed (they are per-build and resolved at publish time — not fabricated).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: titan-prod

resources:
  - ../../base
  - namespace.yaml
  - resourcequota.yaml
  - limitrange.yaml
