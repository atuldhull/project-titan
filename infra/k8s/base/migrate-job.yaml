# Pre-deploy migration Job (Vol 9 §4.2): runs `alembic upgrade head` under the advisory
# lock (Phase 76) BEFORE the new app version rolls out. The release pipeline applies this
# and waits for completion before flipping traffic. Expand/contract discipline (OPS-013)
# keeps it backward-compatible with the still-running old version.
apiVersion: batch/v1
kind: Job
metadata:
  name: titan-migrate
  labels: { app.kubernetes.io/component: migrate, app.kubernetes.io/part-of: titan }
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: { app.kubernetes.io/component: migrate, app.kubernetes.io/part-of: titan }
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: ghcr.io/titan-platform/titan-migrate:0.1.0
          envFrom:
            - configMapRef: { name: titan-config }
            - secretRef: { name: titan-secrets }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
