# Blue/green PREVIEW Services (Vol 9 §5.1, OPS-010). Per HTTP tier, one color-pinned Service
# per color so the release pipeline can run smoke tests against the IDLE color BEFORE the
# stable-Service selector flip sends real traffic to it. Unlike the stable Service (whose
# `.spec.selector.color` is patched at flip time), a preview Service's selector is FIXED to
# one color forever — `<svc>-blue` always targets blue pods, `<svc>-green` always green.
#
# Both colors' preview Services are committed even though only the active color's pods exist
# most of the time: a preview Service with no matching pods simply has zero endpoints (inert,
# no error). `ops/scripts/release.sh` curls `http://<svc>-<idle>.<ns>.svc/healthz` (or /readyz)
# for smoke before flipping. The worker has NO preview Service — it is pull-based (no inbound
# routing); its "smoke" is `kubectl rollout status` + a readiness gate on `titan health`.
#
# These select on component+color; they are NOT covered by the ingress allow-lists (internal
# smoke only, ClusterIP), and datastores have none (never blue/green — shared across colors).
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-blue
  labels: { app.kubernetes.io/part-of: titan, app.kubernetes.io/component: frontend, color: blue }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/component: frontend, app.kubernetes.io/part-of: titan, color: blue }
  ports: [{ name: http, port: 80, targetPort: 3000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-green
  labels: { app.kubernetes.io/part-of: titan, app.kubernetes.io/component: frontend, color: green }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/component: frontend, app.kubernetes.io/part-of: titan, color: green }
  ports: [{ name: http, port: 80, targetPort: 3000 }]
