# Stateless app tiers (Vol 9 §4.2 topology, §4.4 resources, §8.1 HA; §5.1 blue/green).
# Every pod carries liveness+readiness+startup probes (OPS-008): api/orchestrator/llm-gateway
# readiness is /readyz (503 when Postgres/Redis/Qdrant are down ⇒ a bad DSN STALLS the
# rollout, never an outage); the worker has no HTTP server, so its readiness is `titan health`
# (same dep check). Anti-affinity + zone spread keep replicas off one node/zone. Non-root,
# read-only rootfs, all caps dropped. Images are pinned version tags (never :latest); the
# release pipeline rewrites them to @sha256 digests at deploy (see overlays/production).
#
# BLUE/GREEN (§5.1, OPS-010): each stateless tier is deployed per COLOR. The git-canonical
# active color is BLUE, so every Deployment here is `<svc>-blue` and carries `color: blue` in
# its metadata labels, its Deployment `selector.matchLabels`, and its pod template labels. The
# color is IN the selector so blue and green Deployments own DISJOINT pod sets (two Deployments
# sharing a selector would fight over the same pods). The stable Service selects the ACTIVE
# color (`color: blue` here); `ops/scripts/release.sh` renders the idle color, flips the stable
# Service selector atomically, then scales the old color to zero. PDBs/NetworkPolicies select on
# the COMPONENT label only (no color) so they apply to BOTH colors — correct, both need the same
# budgets and network rules. The GREEN Deployments + per-color preview Services live nowhere in
# git by default: green is script-rendered from the live blue Deployment at deploy time and
# scaled to zero between releases (§5.1 "manifests kept" = the blue template is the source).
# Preview Services (both colors, for idle-color smoke tests) are in bluegreen.yaml.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-blue
  labels: { app.kubernetes.io/name: titan, app.kubernetes.io/component: frontend, app.kubernetes.io/part-of: titan, color: blue }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/component: frontend, app.kubernetes.io/part-of: titan, color: blue }
  template:
    metadata:
      labels: { app.kubernetes.io/name: titan, app.kubernetes.io/component: frontend, app.kubernetes.io/part-of: titan, color: blue }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/component: frontend } }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app.kubernetes.io/component: frontend } }
      containers:
        - name: frontend
          image: ghcr.io/titan-platform/titan-frontend:0.1.0
          ports: [{ containerPort: 3000, name: http }]
          envFrom: [{ configMapRef: { name: titan-config } }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          livenessProbe: { httpGet: { path: /, port: 3000 }, periodSeconds: 10, failureThreshold: 3 }
          readinessProbe: { httpGet: { path: /, port: 3000 }, periodSeconds: 10, failureThreshold: 3 }
          startupProbe: { httpGet: { path: /, port: 3000 }, periodSeconds: 3, failureThreshold: 40 }
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app.kubernetes.io/part-of: titan }
spec:
  # Stable Service — selects the ACTIVE color (release.sh patches .spec.selector.color at flip).
  type: ClusterIP
  selector: { app.kubernetes.io/component: frontend, app.kubernetes.io/part-of: titan, color: blue }
  ports: [{ name: http, port: 80, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-blue
  labels: { app.kubernetes.io/name: titan, app.kubernetes.io/component: api, app.kubernetes.io/part-of: titan, color: blue }
spec:
  replicas: 3
  selector:
    matchLabels: { app.kubernetes.io/component: api, app.kubernetes.io/part-of: titan, color: blue }
  template:
    metadata:
      labels: { app.kubernetes.io/name: titan, app.kubernetes.io/component: api, app.kubernetes.io/part-of: titan, color: blue }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/component: api } }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app.kubernetes.io/component: api } }
      containers:
        - name: api
          image: ghcr.io/titan-platform/titan-api:0.1.0
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - configMapRef: { name: titan-config }
            - secretRef: { name: titan-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          livenessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 10, failureThreshold: 3 }
          readinessProbe: { httpGet: { path: /readyz, port: 8000 }, periodSeconds: 10, failureThreshold: 3 }
          startupProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 3, failureThreshold: 40 }
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app.kubernetes.io/part-of: titan }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/component: api, app.kubernetes.io/part-of: titan, color: blue }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-blue
  labels: { app.kubernetes.io/name: titan, app.kubernetes.io/component: orchestrator, app.kubernetes.io/part-of: titan, color: blue }
spec:
  # HONEST HA note: at MVP the orchestrator runs the titan-core app (its Dockerfile CMD is
  # the same uvicorn entrypoint as api — the standalone scheduler is a documented future
  # extraction), and the app has NO session-level leader election. Scheduling/singleton
  # loops today live in the worker (see worker below), so the §8.1 "2 replicas, active/
  # passive, one schedules" story is NOT yet deliverable via manifests. We run 1 replica;
  # K8s reschedules it on failure. Bumping to 2 is safe only once real leader election lands.
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/component: orchestrator, app.kubernetes.io/part-of: titan, color: blue }
  template:
    metadata:
      labels: { app.kubernetes.io/name: titan, app.kubernetes.io/component: orchestrator, app.kubernetes.io/part-of: titan, color: blue }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/component: orchestrator } }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app.kubernetes.io/component: orchestrator } }
      containers:
        - name: orchestrator
          image: ghcr.io/titan-platform/titan-orchestrator:0.1.0
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - configMapRef: { name: titan-config }
            - secretRef: { name: titan-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          livenessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 10, failureThreshold: 3 }
          readinessProbe: { httpGet: { path: /readyz, port: 8000 }, periodSeconds: 10, failureThreshold: 3 }
          startupProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 3, failureThreshold: 40 }
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  labels: { app.kubernetes.io/part-of: titan }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/component: orchestrator, app.kubernetes.io/part-of: titan, color: blue }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-blue
  labels: { app.kubernetes.io/name: titan, app.kubernetes.io/component: worker, app.kubernetes.io/part-of: titan, color: blue }
spec:
  # HA/scaling: `python -m titan.worker` runs the SCALABLE consumer-group loops (executor
  # slots, results, memory embedder + reapers) in EVERY replica with a per-replica consumer
  # name, and the SINGLETON loops (domain-stream→pub/sub fan-out preserving per-project
  # order; the periodic reconcilers) in ONLY the elected leader via a Postgres advisory-lock
  # leader election (titan.runtime.leader). So >1 replica is safe — 2 as a baseline; Phase
  # 80's KEDA scales it to §4.3's 2–50 on queue depth. A dead leader's lock frees and a
  # surviving replica takes over the singletons automatically. Blue/green: the worker flips
  # by scaling the new color up (its KEDA scaler) and draining the old to zero — NOT via a
  # Service selector (workers are pull-based), so the worker Service stays color-agnostic.
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/component: worker, app.kubernetes.io/part-of: titan, color: blue }
  template:
    metadata:
      labels: { app.kubernetes.io/name: titan, app.kubernetes.io/component: worker, app.kubernetes.io/part-of: titan, color: blue }
    spec:
      # graceful drain on scale-down: finish the current task, ack, exit (Vol 9 §4.3).
      terminationGracePeriodSeconds: 120
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/component: worker } }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app.kubernetes.io/component: worker } }
      containers:
        - name: worker
          image: ghcr.io/titan-platform/titan-worker:0.1.0
          ports: [{ containerPort: 9100, name: metrics }]
          envFrom:
            - configMapRef: { name: titan-config }
            - secretRef: { name: titan-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          # no HTTP server ⇒ liveness is the metrics port being up; readiness gates on
          # dependency health via the CLI (OPS-008), so a bad DSN stalls the rollout.
          livenessProbe: { tcpSocket: { port: 9100 }, periodSeconds: 10, failureThreshold: 3 }
          readinessProbe:
            exec: { command: ["titan", "health"] }
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe: { tcpSocket: { port: 9100 }, periodSeconds: 3, failureThreshold: 40 }
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  labels: { app.kubernetes.io/part-of: titan }
spec:
  # headless: workers are pull-based (no inbound routing); the Service is for metrics
  # discovery only. Color-AGNOSTIC on purpose — Prometheus scrapes BOTH colors during a flip.
  clusterIP: None
  selector: { app.kubernetes.io/component: worker, app.kubernetes.io/part-of: titan }
  ports: [{ name: metrics, port: 9100, targetPort: 9100 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway-blue
  labels: { app.kubernetes.io/name: titan, app.kubernetes.io/component: llm-gateway, app.kubernetes.io/part-of: titan, color: blue }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/component: llm-gateway, app.kubernetes.io/part-of: titan, color: blue }
  template:
    metadata:
      labels: { app.kubernetes.io/name: titan, app.kubernetes.io/component: llm-gateway, app.kubernetes.io/part-of: titan, color: blue }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/component: llm-gateway } }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app.kubernetes.io/component: llm-gateway } }
      containers:
        - name: llm-gateway
          # The provider-agnostic gateway is a library invoked in-process; per §4.2 it is
          # its own Deployment for independent scaling, run from the titan-api image with
          # the gateway role until a dedicated image exists (ADR-008: reuse images).
          # HONEST SCOPE: TITAN_ROLE is NOT yet read by the app (settings has no `role` field),
          # so these pods run the FULL titan-api app, not a scoped gateway — the env var is a
          # forward-declaration for the eventual gateway extraction (see the netpol egress gap).
          # `args` restates the Dockerfile CMD (harmless/explicit).
          image: ghcr.io/titan-platform/titan-api:0.1.0
          args: ["uvicorn", "titan.main:app", "--host", "0.0.0.0", "--port", "8000"]
          env: [{ name: TITAN_ROLE, value: llm-gateway }]
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - configMapRef: { name: titan-config }
            - secretRef: { name: titan-secrets }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          livenessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 10, failureThreshold: 3 }
          readinessProbe: { httpGet: { path: /readyz, port: 8000 }, periodSeconds: 10, failureThreshold: 3 }
          startupProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 3, failureThreshold: 40 }
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  labels: { app.kubernetes.io/part-of: titan }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/component: llm-gateway, app.kubernetes.io/part-of: titan, color: blue }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
