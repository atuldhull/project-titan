# Autoscaling (Vol 9 §4.3, TITAN-OPS-009). Stateless web tiers scale on CPU + a real
# in-flight custom metric (titan_http_requests_in_flight / titan_llm_calls_in_flight, now
# emitted by the app — see observability/llm metrics); the worker scales on Redis Streams
# consumer-group lag via KEDA (queue depth, NEVER CPU — agent tasks are I/O-bound). Scale-down
# stabilises over 300s to avoid flapping; workers drain gracefully within the 120s
# terminationGracePeriodSeconds set on the Deployment (Phase 79).
#
# Custom-metric HPAs require prometheus-adapter to publish the Pods metrics to the k8s
# custom-metrics API (a cluster prereq); the KEDA ScaledObject requires the KEDA operator.
# kubeconform validates the built-in HPAs; the KEDA CRD is skipped by design.
#
# BLUE/GREEN (§5.1, OPS-010; the Phase-80-part-1 F4 fix): the autoscalers are TEMPLATED
# PER-COLOR. Each targets the concrete `<svc>-<color>` Deployment (a bare `scaleTargetRef:
# api` would NOT resolve now that the Deployments are `api-blue`/`api-green`), and each carries
# a `color` label so `release.sh` can drop the retired color's autoscaler with
# `kubectl delete hpa,scaledobject -l color=<old>` — which it MUST do BEFORE scaling that color
# to zero, or the HPA's minReplicas would immediately re-inflate the color STEP-4 is retiring.
# Only the ACTIVE (blue) color's autoscalers are committed; `release.sh` renders the idle
# color's from these at flip time and deletes them again at scale-down. So the committed set is
# self-consistent (no autoscaler ever points at an idle, replicas-0 color).
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-blue
  labels: { app.kubernetes.io/part-of: titan, color: blue }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: frontend-blue }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-blue
  labels: { app.kubernetes.io/part-of: titan, color: blue }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api-blue }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Pods
      pods:
        metric: { name: titan_http_requests_in_flight }
        target: { type: AverageValue, averageValue: "50" }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-gateway-blue
  labels: { app.kubernetes.io/part-of: titan, color: blue }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: llm-gateway-blue }
  minReplicas: 2
  maxReplicas: 8
  # CPU-only — HONEST scoping. The provider-agnostic gateway is an in-process LIBRARY
  # invoked inside the worker/api pods (§4.2 note, Phase 79), so titan_llm_calls_in_flight
  # is emitted THERE, not on this Deployment's pods; scaling this tier on it would read ~0
  # (decorative). The real in-flight-LLM load rides the worker's KEDA queue-depth scaling.
  # This Deployment only fronts the HTTP /llm/chat surface (out-of-process plugin callers),
  # for which CPU is the right signal. The §4.3 in-flight-LLM dimension activates if/when the
  # gateway becomes a standalone service (the gauge is already emitted, ready for it).
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
# Worker: KEDA Redis Streams scaler on the run-execute consumer group's pending (XPENDING)
# lag — the primary scaling dimension (§4.3). Target 10 pending/replica, 2..50 replicas.
# cooldownPeriod 300s = scale-down stabilisation; safe to scale now that the singleton loops
# are leader-elected (Phase 80 prep) and only the run-execution consumer group scales.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-blue
  labels: { app.kubernetes.io/part-of: titan, color: blue }
spec:
  scaleTargetRef:
    name: worker-blue
  minReplicaCount: 2
  maxReplicaCount: 50
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: redis-streams
      metadata:
        address: redis:6379
        stream: "stream:runs.execute"
        consumerGroup: "titan-runs-execute"
        pendingEntriesCount: "10"
