# Grafana datasources provisioned as code (Vol 9 §6.2 — no click-ops).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        customQuery: true
        # Span attrs don't map onto Loki labels here, so query by trace id
        # over the whole titan namespace.
        query: '{namespace="titan"} |= "$${__span.traceId}"'

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id": ?"([a-f0-9]{32})"'
          url: "$${__value.raw}"
          datasourceUid: tempo
