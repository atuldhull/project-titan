# Dashboard provider: loads every JSON in /var/lib/grafana/dashboards
# (mounted from infra/grafana/dashboards — dashboards as code, Vol 9 §6.2).
apiVersion: 1

providers:
  - name: titan
    folder: TITAN
    type: file
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
