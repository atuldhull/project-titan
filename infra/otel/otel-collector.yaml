# OTel Collector (ADR-011, Vol 9 §6): receives OTLP from titan services,
# routes traces to Tempo. Metrics are scraped directly by Prometheus from
# /metrics; logs ship via promtail — one concern per pipeline.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
