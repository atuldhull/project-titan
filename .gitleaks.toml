# Gitleaks config (TITAN-FND-062). Extends the default ruleset; allowlists
# vendored/generated trees that are never committed, so filesystem-mode scans
# match what git-mode CI enforces.

[extend]
useDefault = true

# Phase 68: catch a committed age vault identity (TITAN_VAULT_AGE_KEY). The age
# file itself is ciphertext (allowlisted below); the IDENTITY must never land in
# git, and the default ruleset has no age rule, so add one.
# Case-INSENSITIVE: age.parse_identity lower-cases the bech32 string before
# decoding, so a lowercase `age-secret-key-1…` is a fully valid, usable key — a
# case-sensitive rule would miss it (Phase-68 security review).
[[rules]]
id = "titan-age-identity"
description = "age secret key (vault identity) — must never be committed"
regex = '''(?i)AGE-SECRET-KEY-1[0-9A-Za-z]{50,}'''
keywords = ["AGE-SECRET-KEY-1", "age-secret-key-1"]

# Vendored/generated trees never committed, plus the ONE ciphertext vault file
# (age binary, git-safe) — NOT a global `\.age$` suffix, which would
# blanket-exempt any *.age file from EVERY rule and could hide a real leak
# (Phase-68 security review). Path-only (no condition) → a match on any path
# allowlists it.
[[allowlists]]
description = "Vendored/generated trees + the single ciphertext vault file"
paths = [
    '''\.venv/''',
    '''node_modules/''',
    '''\.next/''',
    '''\.git/''',
    '''config/secrets\.yaml\.age$''',
]

# Phase 69: three pre-existing false positives (this scan has been red since the
# fixtures landed in Phase 47 — `make secret-scan` is a Docker/CI job, not in
# the fast per-phase gate loop). Each is AND-scoped to a path + the EXACT fake
# string, so a genuinely new secret in the same file still trips — NOT a blanket
# path exemption (the Phase-68 `\.age$` lesson: never suppress every rule on a
# whole file).
[[allowlists]]
description = "R3 reviewer's own test corpus — a deliberately hardcoded FAKE Stripe key so the hardcoded-secret detector has something to catch"
condition = "AND"
paths = ['''apps/api/tests/review_fixtures\.py''']
regexes = ['''sk-live-abcd1234efgh5678ijkl''']

[[allowlists]]
description = "Tool Bus redactor test — a FAKE api_key value asserted to be masked before the audit row / next prompt"
condition = "AND"
paths = ['''apps/api/tests/test_tools_bus\.py''']
regexes = ['''sk-verysecretkey12345678''']

[[allowlists]]
description = "False positive on the Makefile's OWN secret-scan invocation: MSYS2_ARG_CONV_EXCL is a Git-Bash env-var name, not a credential"
condition = "AND"
paths = ['''(^|/)Makefile$''']
regexes = ['''MSYS2_ARG_CONV_EXCL''']

# Phases 69/75: the redaction detector corpus + the red-team secret-exfil cases.
# These four files exist ONLY to hold one deliberately-fake specimen of every
# credential shape the redaction engine must catch, so the scanner firing on them
# is the fixtures doing their job (22 findings across 9 rules as of Phase 86).
#
# These are PATH-scoped, unlike the three value-scoped entries above, and that is
# a deliberate departure. Value-scoping needs the exact fake string per finding,
# which here would mean 22 literals across 9 rules that silently rot the moment a
# fixture is edited — the scan goes red again and the next person adds another
# literal. Path-scoping a file whose entire purpose is to be a corpus of fakes is
# stable and honest about what the file is.
#
# The Phase-68 `\.age$` lesson still holds and is NOT violated: that mistake was a
# GLOBAL suffix rule that would have exempted any future *.age file anywhere. These
# are four exact, enumerated paths. The residual risk — a genuinely real secret
# pasted into one of these four files would not trip gitleaks — is accepted and
# covered by GitHub secret scanning + push protection on the repository, which
# scans these paths independently (it caught two of these fixtures in Oct 2026 and
# they were triaged as used_in_tests). Do NOT widen these globs.
[[allowlists]]
description = "Redaction engine detector corpus — one FAKE specimen per credential shape (AWS/GCP/GitHub/GitLab/Slack/JWT/age/private-key/titan), asserted to be masked"
paths = ['''apps/api/tests/test_redaction_engine\.py''']

[[allowlists]]
description = "Redaction sink test — FAKE secrets asserted to be masked across the three sinks"
paths = ['''apps/api/tests/test_redaction_sinks\.py''']

[[allowlists]]
description = "Redaction gitleaks-pattern test — FAKE token proving the gitleaks-derived patterns fire"
paths = ['''apps/api/tests/test_redaction_gitleaks\.py''']

[[allowlists]]
description = "Red-team corpus (Phase 75, TITAN-SEC-130) — secret-exfil attack payloads carrying FAKE keys, used to prove the redaction pipeline masks a leaked credential"
paths = ['''apps/api/src/titan/redteam/corpus\.py''']
